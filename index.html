<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GH Deploy · 优选 IP</title>
<style>
  :root{
    --bg:#0f1117; --panel:#171a22; --panel2:#1e2230; --fg:#e6e9ef; --muted:#9aa3b2;
    --accent:#4c9aff; --good:#3ddc84; --warn:#f5c518; --bad:#ff5c7a; --line:#2a2f3d;
    --chip:#2a3140;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f5f6fa; --panel:#ffffff; --panel2:#f0f2f8; --fg:#1a1d24; --muted:#5b6472;
      --accent:#2f7ee5; --good:#0f9d58; --warn:#c98a00; --bad:#d83a52; --line:#e2e5ec; --chip:#e9edf5; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:1040px;margin:0 auto;padding:20px}
  header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
  h1{font-size:20px;margin:0}
  .meta{color:var(--muted);font-size:12px}
  .btn{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;
    padding:7px 12px;cursor:pointer;font-size:13px}
  .btn:hover{border-color:var(--accent)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:14px}
  .card h2{font-size:14px;margin:0 0 10px;color:var(--muted);letter-spacing:.02em}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--panel)}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .chip{display:inline-block;background:var(--chip);border-radius:6px;padding:1px 7px;font-size:11px;color:var(--muted)}
  .ok{color:var(--good)} .warn{color:var(--warn)} .bad{color:var(--bad)}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .copy{border:1px solid var(--line);background:transparent;color:var(--accent);border-radius:6px;
    padding:2px 8px;cursor:pointer;font-size:12px}
  .copy:hover{background:var(--panel2)}
  .row-actions{display:flex;gap:6px}
  input{background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px;width:100%}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:720px){.grid{grid-template-columns:1fr}}
  .vless-box{background:var(--panel2);border:1px dashed var(--line);border-radius:10px;padding:12px;margin-top:10px}
  .vless-out{font-family:ui-monospace,monospace;word-break:break-all;background:var(--bg);
    border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12px;margin-top:8px}
  .hint{color:var(--muted);font-size:12px}
  .empty{color:var(--muted);padding:14px;text-align:center}
  .scorebar{height:4px;background:var(--panel2);border-radius:3px;overflow:hidden;width:80px}
  .scorebar>i{display:block;height:100%;background:var(--accent)}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
  label.f{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px}
  .tabs{display:flex;gap:6px;margin-bottom:10px}
  .tabs button{border:1px solid var(--line);background:var(--panel);color:var(--muted);
    border-radius:8px;padding:6px 12px;cursor:pointer}
  .tabs button.active{color:var(--fg);border-color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>GH Deploy · 优选 IP</h1>
      <div class="meta" id="meta">加载中…</div>
    </div>
    <button class="btn" id="refresh"><span class="spin" style="display:none" id="spin"></span> 刷新</button>
  </header>

  <!-- 生成 vless 链接（UUID 来自你的客户端，不存仓库） -->
  <div class="card">
    <h2>生成订阅链接</h2>
    <div class="hint">选一个 IP，填入你自己的 UUID（存于 GitHub Secrets，不公开），生成 vless:// 链接用于客户端导入。</div>
    <div class="grid" style="margin-top:10px">
      <div>
        <label class="f">IP</label>
        <select id="pick" style="width:100%;padding:8px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);color:var(--fg)"></select>
      </div>
      <div>
        <label class="f">UUID（必填，仅本地使用）</label>
        <input id="uuid" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx">
      </div>
      <div>
        <label class="f">SNI</label>
        <input id="sni" placeholder="visa.cn">
      </div>
      <div>
        <label class="f">Path</label>
        <input id="path" value="/">
      </div>
    </div>
    <div class="vless-box">
      <div id="vlessout" class="vless-out mono" style="display:none"></div>
      <div class="row-actions" style="margin-top:8px">
        <button class="copy" id="build">生成链接</button>
        <button class="copy" id="copy" style="display:none">复制</button>
      </div>
    </div>
  </div>

  <div class="tabs">
    <button class="active" data-tab="scan">扫描结果</button>
    <button data-tab="speed">测速结果</button>
  </div>

  <div class="card" id="tab-scan">
    <h2>Top 扫描</h2>
    <div id="scantbody"></div>
  </div>

  <div class="card" id="tab-speed" style="display:none">
    <h2>测速（真实出口）</h2>
    <div id="speedbody"></div>
  </div>

  <p class="hint" style="margin-top:16px">
    本页由 GitHub Actions 自动更新，数据来自本仓库 <code>output/</code>。
    测速需在已挂 self-hosted runner 的环境运行（<code>speed-test.yml</code>）。
  </p>
</div>

<script>
const $ = s => document.querySelector(s);
const state = { top: [], speed: [], meta: {} };

function fmtTime(s){ if(!s) return "—"; const d=new Date(s); return d.toLocaleString("zh-CN",{hour12:false}); }

async function load(){
  $("#spin").style.display="inline-block";
  try{
    const [scan, speed] = await Promise.all([
      fetch("output/scan_result.json",{cache:"no-store"}).then(r=>r.ok?r.json():{}).catch(()=>({})),
      fetch("output/speed.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null),
    ]);
    state.top = scan.top||[];
    state.speed = (speed&&speed.results)||[];
    state.meta = scan;
    renderMeta(); renderScan(); renderSpeed(); renderPick();
  }finally{ $("#spin").style.display="none"; }
}

function renderMeta(){
  $("#meta").textContent =
    `共 ${state.top.length} 个 · 更新 ${fmtTime(state.meta.updated_at)} · 源 ${state.meta.source||"?"}`;
}

function copy(text){
  navigator.clipboard?.writeText(text).catch(()=>{});
}

function renderScan(){
  const el = $("#scantbody");
  if(!state.top.length){ el.innerHTML = `<div class="empty">暂无扫描结果（等待 scan.yml 首次运行）</div>`; return; }
  let h = `<table><thead><tr><th>#</th><th>IP</th><th>POP</th><th>地区</th><th class="num">延迟</th><th class="num">得分</th><th></th></tr></thead><tbody>`;
  state.top.forEach((r,i)=>{
    const pct = Math.max(0,Math.min(100,(r.score/150)*100)).toFixed(0);
    h += `<tr>
      <td class="num muted">${i+1}</td>
      <td class="mono">${r.ip}</td>
      <td><span class="chip">${r.colo||"UNK"}</span></td>
      <td><span class="chip">${r.loc||"UNK"}</span></td>
      <td class="num">${r.delay_ms} ms</td>
      <td class="num">${r.score}<div class="scorebar" style="margin-top:3px"><i style="width:${pct}%"></i></div></td>
      <td><button class="copy" data-ip="${r.ip}">复制 IP</button></td>
    </tr>`;
  });
  h += `</tbody></table>`;
  el.innerHTML = h;
  el.querySelectorAll("[data-ip]").forEach(b=>b.onclick=()=>copy(b.dataset.ip));
}

function renderSpeed(){
  const el = $("#speedbody");
  if(!state.speed.length){ el.innerHTML = `<div class="empty">暂无测速数据（需挂 self-hosted runner 运行 speed-test.yml）</div>`; return; }
  let h = `<table><thead><tr><th>IP</th><th>POP</th><th>地区</th><th class="num">速度</th></tr></thead><tbody>`;
  state.speed.forEach(r=>{
    const cls = r.speed_mbps>=25?"ok":(r.speed_mbps>=5?"warn":"bad");
    h += `<tr><td class="mono">${r.ip}</td><td><span class="chip">${r.colo||"—"}</span></td>
      <td><span class="chip">${r.loc||"—"}</span></td>
      <td class="num ${cls}">${r.speed_mbps} Mbps</td></tr>`;
  });
  h += `</tbody></table>`;
  el.innerHTML = h;
}

function renderPick(){
  const sel = $("#pick");
  sel.innerHTML = state.top.map((r,i)=>`<option value="${i}">${r.ip} · ${r.colo||"?"} ${r.loc||"?"} · ${r.delay_ms}ms · ${r.score}</option>`).join("");
}

function buildVless(){
  const i = parseInt($("#pick").value||"0",10);
  const r = state.top[i];
  const uuid = $("#uuid").value.trim();
  const sni = $("#sni").value.trim() || "visa.cn";
  const path = $("#path").value.trim() || "/";
  if(!r || !uuid){ alert("请选择 IP 并填入 UUID"); return; }
  const b64 = btoa(uuid.replace(/-/g,""));
  const url = `vless://${uuid}@${r.ip}:443?` +
    `security=tls&type=tls&sni=${sni}&path=${encodeURIComponent(path)}&type=tcp&alpn=h2,http/1.1` +
    `#${encodeURIComponent((r.colo||"?")+" "+(r.loc||"?"))}`;
  const out = $("#vlessout"); out.style.display="block"; out.textContent = url;
  $("#copy").style.display="inline-block";
}

$("#build").onclick = buildVless;
$("#copy").onclick = ()=>{ navigator.clipboard?.writeText($("#vlessout").textContent); };
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  const t=b.dataset.tab;
  $("#tab-scan").style.display = t==="scan"?"":"none";
  $("#tab-speed").style.display = t==="speed"?"":"none";
});
$("#refresh").onclick = load;
// SNI 从 scan_result.json 元数据里带不回来（避免泄露），这里默认值让用户自己填
load();
setInterval(()=>{ /* 可选自动刷新 */ }, 30*60*1000);
</script>
</body>
</html>
