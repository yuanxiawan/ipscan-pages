name: trigger-private-scan

on:
  schedule:
    # 每 30 分钟触发私有仓库的扫描。
    # 刻意错开 :00/:30（GitHub cron 拥堵槽位）与本机计划任务的 :21/:51。
    - cron: "27,57 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch scan.yml in private repo
        env:
          TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "DISPATCH_TOKEN 未配置：请在 ipscan-pages 的 Secrets 中添加（细粒度 PAT，含 ipscan 仓库的 Actions 读写权限）"
            exit 1
          fi
          code=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/yuanxiawan/ipscan/actions/workflows/scan.yml/dispatches \
            -d '{"ref":"main"}')
          echo "HTTP $code"
          if [ "$code" = "204" ]; then
            echo "已触发私有仓库扫描"
          else
            cat /tmp/resp.txt
            exit 1
          fi
