name: refresh-data

on:
  schedule:
    # 每 30 分钟触发一次上游数据刷新（错开 :00/:30 拥堵槽位与本机任务 :21/:51）
    
    - cron: "27,57 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Trigger upstream refresh
        env:
          TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          URL: ${{ secrets.DISPATCH_URL }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$URL" ]; then
            echo "缺少 DISPATCH_TOKEN / DISPATCH_URL 配置（仓库 Secrets）"
            exit 1
          fi
          code=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$URL" -d '{"ref":"main"}')
          echo "HTTP $code"
          if [ "$code" = "204" ]; then
            echo "刷新已触发"
          else
            cat /tmp/resp.txt
            exit 1
          fi
